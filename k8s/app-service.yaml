apiVersion: v1
kind: Service
metadata:
  name: topgainers-svc
  namespace: topgainers
spec:
  selector:
    app: topgainers-app
  ports:
    - name: streamlit
      port: 8501
      targetPort: 8501
      nodePort: 30001
    - name: metrics
      port: 8000
      targetPort: 8000
      nodePort: 30002
  type: NodePort