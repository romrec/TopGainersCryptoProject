# Nom du workflow (visible dans GitHub Actions)
name: CI/CD Pipeline

# Quand exécuter le workflow ?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Tâches à exécuter
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crypto_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Vérifier le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: crypto_data
          DB_USER: postgres
          DB_PASSWORD: test_password
        run: |
          python -m pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le code source
        uses: actions/checkout@v4

      - name: Configurer QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter au registre GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le code source
        uses: actions/checkout@v4

      - name: Déployer sur EC2 (t3.micro Free Tier)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/topgainers
            git pull origin main
            docker compose pull top-gainers-crypto
            docker compose up -d --force-recreate top-gainers-crypto
            echo "=== CONTENEURS ==="
            docker compose ps
            echo "=== HEALTH CHECK ==="
            curl -s -o /dev/null -w "App: %{http_code}" --connect-timeout 10 http://localhost:8501
            echo ""
            curl -s -o /dev/null -w "Prometheus: %{http_code}" --connect-timeout 5 http://localhost:9090/-/healthy
            echo ""
            curl -s -o /dev/null -w "Grafana: %{http_code}" --connect-timeout 5 http://localhost:3000/api/health
            echo ""
