# Nom du workflow (visible dans GitHub Actions)
name: Docker Build CI

# Quand exécuter le workflow ?
on:
  push:
    branches: [ main ]       # À chaque push sur la branche "main"
  pull_request:
    branches: [ main ]       # À chaque pull request vers "main"

# Tâches à exécuter
jobs:
  build:
    runs-on: ubuntu-latest   # Machine virtuelle Ubuntu

    steps:
      # 1. Récupère le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Prépare Docker Buildx (outil pour construire des images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Se connecte à Docker Hub (pour pousser l'image)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }} 
          password: ${{ secrets.DOCKER_HUB_TOKEN }}  

      # 4. Construit l'image Docker
      - name: Build Docker image
        run: docker build -t ton-utilisateur/top-gainers-crypto:latest .

      # 5. Pousse l'image vers Docker Hub
      - name: Push Docker image to Docker Hub
        run: docker push ton-utilisateur/top-gainers-crypto:latest
