name: Build & Deploy Docker

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          DB_HOST: localhost
          DB_NAME: topgainers
          DB_USER: test
          DB_PASSWORD: test
          DB_PORT: 5432

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Configuration SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 13.38.175.135 >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH configuré"

      - name: Déploiement sur l'instance EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@13.38.175.135 '
            set -e
            echo "=== LOGIN DOCKER ==="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u romain -p "${{ secrets.GHCR_TOKEN }}" --password-stdin
            echo "=== PULL IMAGE ==="
            docker pull ghcr.io/romain/top-gainers-crypto:latest
            echo "=== DOCKER COMPOSE ==="
            cd /home/ubuntu/topgainers && docker compose pull app && docker compose up -d app
          '
        </tool_result>
