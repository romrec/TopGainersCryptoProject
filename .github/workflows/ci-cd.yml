name: CI/CD - Tests, build & déploiement

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/romrec/topgainerscryptoproject

jobs:
  test:
    name: Tests (pytest + couverture)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: topgainers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-cov

      - name: Lancer les tests avec couverture
        run: python -m pytest tests/ -v --tb=short --cov=top_movers --cov=db --cov-report=term-missing --cov-report=xml --cov-fail-under=80
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: topgainers
          DB_USER: test
          DB_PASSWORD: test

      - name: Uploader le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture
          path: coverage.xml

  build:
    name: Build & push image Docker (GHCR)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Se connecter au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Vérifier que l image publiée sur GHCR marche (smoke test)
        run: |
          echo "=== Pull de l image publiée ==="
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "=== Démarrage conteneur de vérification ==="
          docker run --rm -d \
            --name smoke-test \
            -p 127.0.0.1:8501:8501 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "=== Attente que l application réponde ==="
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1; then
              echo "OK : image publiée et accessible sur le port 8501 (SHA: ${{ github.sha }})"
              docker rm -f smoke-test
              exit 0
            fi
            sleep 2
            echo "   ... pas encore prêt ($i/30)"
          done

          echo "FAILED : l image ne répond pas en 60s" >&2
          docker rm -f smoke-test
          exit 1

  deploy:
    name: Déploiement sur EC2 (SSH)
    needs: build
    runs-on: ubuntu-latest
    env:
      # IP de l'instance EC2 cible.
      # Surchargeable par une variable GitHub Actions "EC2_HOST"
      # (Settings > Secrets and variables > Actions > Variables),
      # sinon le secret "EC2_HOST" est utilisé en repli.
      EC2_HOST: ${{ vars.EC2_HOST || secrets.EC2_HOST }}
      AWS_REGION: eu-west-3
      SG_NAME: topgainers-sg
      APP_DIR: /opt/topgainers
      # Tag AWS de l'instance cible, utilise pour resoudre l'IP publique.
      INSTANCE_TAG_NAME: topgainers-vm

    steps:
      - name: Configurer les credentials AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resoudre l'adresse IP de l'instance
        id: resolve-host
        run: |
          set -euo pipefail

          # Source de verite : AWS. L'IP est lue a chaque run depuis l'instance
          # tagguee, ce qui survit aux reconstructions d'instance (cause historique
          # des echecs de deploiement : IP obsolete codee en dur).
          IP=$(aws ec2 describe-instances \
            --region "${{ env.AWS_REGION }}" \
            --filters "Name=tag:Name,Values=${{ env.INSTANCE_TAG_NAME }}" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].PublicIpAddress" \
            --output text 2>/dev/null | tr '\t' '\n' | grep -E '^[0-9]+\.' | head -n 1 || true)

          if [ -n "$IP" ]; then
            echo "IP resolue via AWS (tag ${{ env.INSTANCE_TAG_NAME }}) : $IP"
          else
            IP="${{ env.EC2_HOST }}"
            if [ -z "$IP" ]; then
              echo "ERROR : impossible de resoudre l'IP de l'instance cible" >&2
              echo "  - l'instance tagguee ${{ env.INSTANCE_TAG_NAME }} est-elle 'running' ?" >&2
              echo "  - la variable GitHub Actions EC2_HOST est-elle definie ?" >&2
              exit 1
            fi
            echo "IP resolue via la variable GitHub Actions EC2_HOST : $IP"
          fi

          echo "host=$IP" >> "$GITHUB_OUTPUT"

      - name: Récupérer l'IP publique du runner
        id: runner-ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "runner_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "IP du runner : $IP"

      - name: Autoriser l'accès SSH depuis le runner
        id: authorize
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${{ env.SG_NAME }}" \
            --query "SecurityGroups[0].GroupId" --output text)
          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.runner-ip.outputs.runner_ip }}/32}]" \
            --no-dry-run >/dev/null
          echo "Accès SSH autorisé pour ${{ steps.runner-ip.outputs.runner_ip }}/32"

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ steps.resolve-host.outputs.host }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH configuré vers ${{ steps.resolve-host.outputs.host }}"

      - name: Déploiement sur l'instance EC2
        env:
          DEPLOY_TIMEOUT: "300"
        run: |
          set -euo pipefail

          echo "=== 1. Test de connectivité SSH vers ${{ steps.resolve-host.outputs.host }} ==="
          if ! timeout 20 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
               -i ~/.ssh/id_rsa ubuntu@${{ steps.resolve-host.outputs.host }} 'echo SSH_OK'; then
            echo "ERROR : SSH injoignable sur ${{ steps.resolve-host.outputs.host }}" >&2
            echo "  - L'instance est-elle toujours 'running' ?" >&2
            echo "  - Le Security Group autorise-t-il le port 22 depuis le runner ?" >&2
            echo "  - secrets.SSH_PRIVATE_KEY correspond-il a la cle de l'instance ?" >&2
            exit 1
          fi

          echo "=== 2. PULL IMAGE + RESTART COMPOSE ==="
          timeout "$DEPLOY_TIMEOUT" ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ steps.resolve-host.outputs.host }} "
            set -e
            cd ${{ env.APP_DIR }}
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker compose pull top-gainers-crypto
            docker compose up -d top-gainers-crypto
            echo '--- Conteneurs ---'
            docker compose ps
          "

          echo "=== 3. Verification de sante de l application ==="
          for i in $(seq 1 30); do
            if curl -fsS http://${{ steps.resolve-host.outputs.host }}:8501/_stcore/health >/dev/null 2>&1; then
              echo "OK : application joignable sur le port 8501"
              exit 0
            fi
            sleep 2
            echo "   ... pas encore pret ($i/30)"
          done

          echo "FAILED : l application ne repond pas sur le port 8501" >&2
          exit 1

      - name: Révoquer l'accès SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ steps.authorize.outputs.sg_id }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.runner-ip.outputs.runner_ip }}/32}]" \
            >/dev/null 2>&1 || echo "Réponse du SG déjà supprimée"
          echo "Accès SSH révoqué pour ${{ steps.runner-ip.outputs.runner_ip }}/32"
