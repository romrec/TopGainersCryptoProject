name: CI/CD - Tests, build & déploiement

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/romrec/topgainerscryptoproject

jobs:
  test:
    name: Tests (pytest + couverture)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: topgainers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-cov

      - name: Lancer les tests avec couverture
        run: python -m pytest tests/ -v --tb=short --cov=top_movers --cov=db --cov-report=term-missing --cov-report=xml --cov-fail-under=80
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: topgainers
          DB_USER: test
          DB_PASSWORD: test

      - name: Uploader le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture
          path: coverage.xml

  build:
    name: Build & push image Docker (GHCR)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Se connecter au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Déploiement sur EC2 (SSH)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 13.38.175.135 >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH configuré"

      - name: Déploiement sur l'instance EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@13.38.175.135 '
            set -e
            echo "=== LOGIN GHCR ==="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u romain --password-stdin
            echo "=== PULL IMAGE ==="
            docker pull ${{ env.IMAGE_NAME }}:latest
            echo "=== RESTART COMPOSE ==="
            cd /home/ubuntu/topgainers && docker compose pull app && docker compose up -d app
          '
