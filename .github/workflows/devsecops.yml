name: DevSecOps Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:

  # ─────────────────────────────────────────
  # 1. SAST — Analyse statique du code (IA)
  # ─────────────────────────────────────────
  sast:
    name: SAST – Snyk Code
    runs-on: ubuntu-latest
    continue-on-error: true  # ne bloque pas le pipeline tant que SNYK_TOKEN n'est pas configuré
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk SAST
        uses: snyk/actions/node@master
#        env:
#          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  # Configurer dans Settings > Secrets > Actions
        with:
          command: code test
          args: --severity-threshold=high --sarif-file-output=snyk-sast.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-sast.sarif

  # ─────────────────────────────────────────
  # 2. SCA — Analyse des dépendances
  # ─────────────────────────────────────────
  sca:
    name: SCA – Snyk Open Source
    runs-on: ubuntu-latest
    continue-on-error: true  # ne bloque pas le pipeline tant que SNYK_TOKEN n'est pas configuré
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk SCA
        uses: snyk/actions/node@master
#        env:
#          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  # Configurer dans Settings > Secrets > Actions
        with:
          command: test
          args: --severity-threshold=high

  # ─────────────────────────────────────────
  # 3. Tests unitaires (pytest)
  # ─────────────────────────────────────────
  test:
    name: Unit Tests – pytest
    runs-on: ubuntu-latest
    needs: [sast, sca]  # bloque si SAST/SCA échouent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────
  # 4. Build Docker Image
  # ─────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [sast, sca, test]  # bloque si SAST/SCA/TESTS échouent
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t myapp:${{ github.sha }} .

  # ─────────────────────────────────────────
  # 5. Déploiement Streamlit Community Cloud
  # ─────────────────────────────────────────
  deploy-streamlit:
    name: Deploy → Streamlit Cloud
    runs-on: ubuntu-latest
    needs: [test]  # déploiement dès que les tests passent
    if: github.ref == 'refs/heads/main'  # uniquement sur main
    steps:
      - uses: actions/checkout@v4
      - name: Notify deployment
        run: |
          echo "✅ Tests passés sur main"
          echo "➡️ Déploiement automatique via Streamlit Community Cloud"
          echo "📌 Lier le dépôt sur https://share.streamlit.io"
          echo "   Dépôt : romrec/TopGainersCryptoProject"
          echo "   Branche : main"
          echo "   Fichier : app.py"

  # ─────────────────────────────────────────
  # 5. DAST — Scan dynamique (après déploiement)
  # ─────────────────────────────────────────
  dast:
    name: DAST – OWASP ZAP
    runs-on: ubuntu-latest
    needs: deploy-streamlit
    continue-on-error: true  # ne bloque pas tant que l'URL Streamlit n'est pas définie
    steps:
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'https://topgainerscrypto.streamlit.app'  # URL Streamlit Cloud (à confirmer)
          fail_action: false  # informatif uniquement
