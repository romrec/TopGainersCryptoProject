services:
  top-gainers-crypto-test:
    build:
      context: ..
      dockerfile: test/Dockerfile.test
    ports:
      - "8502:8502"
      - "8001:8001"
    volumes:
      - ../data-test:/app/data
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  prometheus-test:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.test.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped