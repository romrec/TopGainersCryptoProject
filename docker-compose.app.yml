services:
  top-gainers-crypto:
    build: .
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=crypto_data
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - PYTHONPATH=/apps
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crypto_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data: {}